name: Kyo Bodo official GA4 and GSC read-only report (no paid connector)

on:
  pull_request:
    paths:
      - "analytics/**"
      - ".github/workflows/free-google-measurement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test site isolation, campaign data quality, and missing data
        run: python -m unittest discover -s analytics -p 'test_*.py' -v
      - name: Verify offline configuration reports UNKNOWN rather than 0
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ""
        run: |
          python analytics/read_only_report.py
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("audit-results/free-google/report.json").read_text())
          assert report["ga4"]["status"]=="NOT_CONFIGURED"
          assert report["gsc"]["status"]=="NOT_CONFIGURED"
          assert report["ga4"]["metrics"] is None
          assert report["gsc"]["metrics"] is None
          print("OFFLINE_STATUS_OK: no credentials, no invented metrics")
          PY

  official-read-only-report:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: kyo-bodo-official-measurement
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run source-independent validation (no Google credential needed)
        run: python -m unittest discover -s analytics -p 'test_*.py' -v
      - name: Authenticate with keyless GitHub-to-Google OIDC only when configured
        if: ${{ vars.KYO_GCP_WIF_PROVIDER != '' && vars.KYO_GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.KYO_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.KYO_GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Install the official API authentication client when authorized
        if: ${{ vars.KYO_GCP_WIF_PROVIDER != '' && vars.KYO_GCP_SERVICE_ACCOUNT != '' }}
        run: python -m pip install --quiet 'google-auth[requests]>=2,<3'
      - name: Collect only aggregate GA4 and final Search Console data
        run: |
          python analytics/read_only_report.py
          cat audit-results/free-google/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save read-only status and aggregate source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyo-bodo-official-google-report
          path: audit-results/free-google/
          if-no-files-found: warn
          retention-days: 14
