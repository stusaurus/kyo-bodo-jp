name: SEO live mobile audit
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and deploy kyo-bodo-jp"]
    types: [completed]
permissions:
  contents: read
jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium test environment
        run: |
          npm install --prefix /tmp/seo-audit --no-audit --no-fund playwright@1.56.1
          /tmp/seo-audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Audit public desktop and mobile pages
        env:
          SEO_BASE: https://stusaurus.github.io/kyo-bodo-jp/
          SEO_PATHS: "scenes/two-player/,scenes/couple/,scenes/children/,scenes/short/,scenes/solo/,guides/two-player-cooperative/,guides/gift-board-games/,games/ito/,games/mandala/,games/quarto/,games/nana-toridori/,games/incan-gold-rediscovered/,games/ciao-ciao/,games/nmbr9/,games/houseki-ippai/,games/animal-old-maid/,games/ding/,games/eggsposed/,scenes/family/,scenes/large-group/"
        run: |
          node <<'AUDIT_NODE'
            const {chromium}=require('/tmp/seo-audit/node_modules/playwright');
            const fs=require('fs');
            const {short_count:SHORT_COUNT}=require('./data/catalog_qa_baseline.json');
            const base=process.env.SEO_BASE;
            const paths=['',...process.env.SEO_PATHS.split(',')];
            (async()=>{
              fs.mkdirSync('seo-mobile-evidence',{recursive:true});
              const browser=await chromium.launch();
              const results=[];
              let blockedAnalyticsRequests=0;
              for(const width of [320,390,1440]){
                const context=await browser.newContext({viewport:{width,height:900},isMobile:width<500,hasTouch:width<500,locale:'ja-JP'});
                // Never transmit synthetic audit pageviews or affiliate events into production GA4.
                // Set interception BEFORE page creation and navigation, including redirects/beacons.
                await context.route(/(?:googletagmanager\.com|google-analytics\.com|analytics\.google\.com|stats\.g\.doubleclick\.net)/i,route=>{
                  blockedAnalyticsRequests++;
                  return route.abort();
                });
                for(const p of paths){
                  const page=await context.newPage();
                  const url=base+p, issues=[],warnings=[];
                  try{
                    const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                    await page.waitForTimeout(750);
                    const data=await page.evaluate(()=>{
                      const meta=(q,a='content')=>document.querySelector(q)?.getAttribute(a)||'';
                      const schemas=[...document.querySelectorAll('script[type="application/ld+json"]')];
                      const offer=document.querySelector('.product-panel a.btn.rakuten.large');
                      const panel=document.querySelector('.product-panel');
                      const heroOffer=document.querySelector('.game-hero-purchase a.game-hero-purchase-link');
                      const heroPurchase=document.querySelector('.game-hero-purchase');
                      return {title:document.title,description:meta('meta[name="description"]'),canonical:meta('link[rel="canonical"]','href'),robots:meta('meta[name="robots"]'),viewport:meta('meta[name="viewport"]'),h1:document.querySelectorAll('h1').length,documentWidth:document.documentElement.scrollWidth,viewportWidth:innerWidth,invalidSchemas:schemas.filter(x=>{try{JSON.parse(x.textContent);return false}catch{return true}}).length,
                        shortCount:document.querySelectorAll('[data-short-game]').length,
                        soloCards:document.querySelectorAll('.game-card').length,
                        cooperativeRows:document.querySelectorAll('[data-cooperative-game]').length,
                        childNine:!!document.querySelector('#children-age option[value="9"]'),
                        giftDetailLinks:[...document.querySelectorAll('.gift-age .gift-cards a[data-track="game_detail_click"][data-source="gift_guide"]')].map(a=>({id:a.dataset.gameId,href:a.getAttribute('href')})),
                        giftTableLinks:[...document.querySelectorAll('.gift-age .gift-table a[data-gift-detail][data-track="game_detail_click"][data-source="gift_guide"]')].map(a=>({id:a.dataset.gameId,href:a.getAttribute('href')})),
                        giftGroupCount:document.querySelectorAll('.gift-age').length,
                        coupleChoiceLinks:[...document.querySelectorAll('.couple-choice-card a[data-source="couple_choice"]')].map(a=>({id:a.dataset.gameId,href:a.getAttribute('href')})),
                        coupleDecisionHeading:!!document.querySelector('#couple-choose-title'),
                        gaConfigured:!!window.KYO_BODO_CONFIG?.gaMeasurementId,
                        offer:offer&&panel?{href:offer.href,affiliate:offer.dataset.affiliate||'',track:offer.dataset.track||'',rel:offer.rel,text:panel.innerText}:null,
                        heroOffer:heroOffer&&heroPurchase?{href:heroOffer.href,affiliate:heroOffer.dataset.affiliate||'',track:heroOffer.dataset.track||'',rel:heroOffer.rel,source:heroOffer.dataset.source,visible:getComputedStyle(heroPurchase).display!=='none',height:heroOffer.getBoundingClientRect().height,text:heroPurchase.innerText}:null};
                    });
                    if(response.status()!==200)issues.push('HTTP '+response.status());
                    if(!data.title||!data.description||data.canonical!==url||data.h1!==1||!data.viewport.includes('width=device-width')||data.invalidSchemas||/noindex/i.test(data.robots))issues.push('SEO metadata or canonical inconsistent');
                    if(data.documentWidth>data.viewportWidth+2)warnings.push('horizontal overflow '+data.documentWidth+' > '+data.viewportWidth);
                    if(p==='scenes/short/'&&data.shortCount!==SHORT_COUNT)issues.push(`20-minute comparison count ${data.shortCount} differs from reviewed ${SHORT_COUNT}`);
                    if(p==='scenes/solo/'&&data.soloCards!==14)issues.push('solo comparison does not show 14 games');
                    if(p==='guides/two-player-cooperative/'&&data.cooperativeRows!==15)issues.push('two-player cooperative guide does not show 15 games');
                    if(p==='scenes/children/'&&!data.childNine)issues.push('missing age-nine filter option');
                    if(p==='guides/gift-board-games/'){
                      const expected=['dobble','nine-tiles','bandido','zombie-kidz','kingdomino','the-game','harmonies','splendor-duel','the-crew-deep-sea'];
                      if(data.giftGroupCount!==3||data.giftDetailLinks.length!==expected.length||data.giftTableLinks.length!==expected.length||
                         data.giftDetailLinks.some((x,i)=>x.id!==expected[i]||x.href!==new URL('games/'+expected[i]+'/',base).pathname)||
                         data.giftTableLinks.some((x,i)=>x.id!==expected[i]||x.href!==new URL('games/'+expected[i]+'/',base).pathname))
                        issues.push('gift guide product choices or internal details are inconsistent');
                    }
                    if(p==='scenes/couple/'){
                      const expected=['ito','codenames-duet','patchwork'];
                      if(!data.coupleDecisionHeading||data.coupleChoiceLinks.length!==expected.length||
                         data.coupleChoiceLinks.some((x,i)=>x.id!==expected[i]||
                           x.href!==new URL('games/'+expected[i]+'/',base).pathname))
                        issues.push('couple decision guide or three game detail links are missing');
                    }
                    if(p.startsWith('games/')){
                      if(!data.offer)issues.push('missing purchase/search panel');
                      else if(data.offer.affiliate==='rakuten'){
                        if(!data.offer.rel.includes('sponsored')||!data.offer.href.startsWith('https://hb.afl.rakuten.co.jp/')||!data.offer.text.includes('PR：'))issues.push('verified affiliate disclosure mismatch');
                      }else if(data.offer.track==='rakuten_search_click'){
                        if(data.offer.rel.includes('sponsored')||!data.offer.href.startsWith('https://search.rakuten.co.jp/')||!data.offer.text.includes('通常検索へ移動します')||data.offer.text.includes('PR：'))issues.push('ordinary search disclosure mismatch');
                      }else issues.push('unclassified Rakuten outbound link');
                      // Reject unsafe or hidden mobile shortcuts; no external link click.
                      if(!data.heroOffer||!data.offer)issues.push('missing mobile product shortcut');
                      else{
                        const h=data.heroOffer,o=data.offer,show=width<=760;
                        if(h.source!=='game_detail_hero'||h.href!==o.href||h.affiliate!==o.affiliate||
                           h.track!==o.track||h.rel!==o.rel||h.visible!==show||
                           (show&&h.height<44))
                          issues.push('mobile shortcut differs from safe product panel');
                        if(o.affiliate==='rakuten'&&!h.text.includes('PR：'))
                          issues.push('mobile verified offer missing PR disclosure');
                        if(o.track==='rakuten_search_click'&&
                           (!h.text.includes('検索結果には別作品')||h.text.includes('PR：')))
                          issues.push('mobile search not clearly classified');
                      }
                    }
                    if(width<500)await page.screenshot({path:'seo-mobile-evidence/'+width+'-'+(p.replace(/\//g,'-')||'home')+'.png',animations:'disabled'});
                    results.push({width,url,status:response.status(),...data,issues,warnings});
                    console.log(JSON.stringify({width,path:p||'/',status:response.status(),issues,warnings}));
                  }catch(e){issues.push(e.message);results.push({width,url,issues,warnings});console.error(url,e.message)}
                  await page.close();
                }
                await context.close();
              }
              await browser.close();
              const fatal=results.filter(x=>x.issues.length);
              fs.writeFileSync('seo-mobile-evidence/report.json',JSON.stringify({results,fatal,blockedAnalyticsRequests},null,2));
              console.log('SEO_MOBILE_SUMMARY '+JSON.stringify({checked:results.length,failed:fatal.length,overflow:results.filter(x=>x.warnings.length).length,blockedAnalyticsRequests}));
              if(fatal.length)process.exitCode=1;
            })().catch(e=>{console.error(e);process.exitCode=1});
            
          AUDIT_NODE
      - name: Preserve screenshot and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-mobile-evidence
          path: seo-mobile-evidence/
          retention-days: 14
