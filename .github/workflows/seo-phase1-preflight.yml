name: SEO phase one preflight
on:
  pull_request:
    branches: [main]
    paths: ['scripts/**', 'src/**', 'assets/**', 'tests/**', '.github/workflows/seo-phase1-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check existing JavaScript syntax
        run: |
          node --check assets/diagnosis.js
          node --check assets/today.js
          node --check assets/decision-insights.js
          node tests/test_decision_insights.cjs
          node --check assets/media.js
          node --check assets/children-filter.js
          node --check assets/short-filter.js
          node --check assets/catalog-search.js
          node --check assets/catalog-compare.js
          node --check scripts/check_children_age_comparison.cjs
          node --check scripts/check_short_time_finder.cjs
          node --check scripts/check_two_player_cooperative_guide.cjs
          node --check scripts/check_note_referral_funnel.cjs
          node --check scripts/check_catalog_expansion_pages.cjs
          node --check scripts/check_catalog_title_search.cjs
          node --check scripts/check_catalog_two_game_compare.cjs
          node --check scripts/check_solo_discovery.cjs
          node --check scripts/check_rakuten_preorder.cjs
      - name: Validate diagnosis, game pages and SEO files
        env:
          SITE_URL: https://stusaurus.github.io/kyo-bodo-jp/
        run: |
          python -m pip install --quiet pytest
          pytest -q
          python scripts/build_site.py
          python scripts/generate_seo_files.py
          python scripts/validate_site.py
          if grep -q '<lastmod>' site/sitemap.xml; then echo "Unverified lastmod found"; exit 1; fi
      - name: Prepare unchanged-offer before and after previews
        env:
          SCENE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python scripts/prepare_scene_comparison.py
      - name: Verify scene comparison at 320, 390 and 1440 pixels
        run: |
          npm install --prefix /tmp/scene-qa --no-audit --no-fund playwright@1.56.1 lighthouse@12.8.2
          /tmp/scene-qa/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/scene-qa/node_modules node scripts/check_scene_presentation.cjs
          NODE_PATH=/tmp/scene-qa/node_modules node scripts/check_today_choices.cjs
          NODE_PATH=/tmp/scene-qa/node_modules node scripts/check_catalog_expansion_pages.cjs
          NODE_PATH=/tmp/scene-qa/node_modules node scripts/check_catalog_title_search.cjs
          NODE_PATH=/tmp/scene-qa/node_modules node scripts/check_catalog_two_game_compare.cjs
          NODE_PATH=/tmp/scene-qa/node_modules node scripts/check_solo_discovery.cjs
          NODE_PATH=/tmp/scene-qa/node_modules node scripts/check_rakuten_preorder.cjs
          NODE_PATH=/tmp/scene-qa/node_modules node scripts/check_children_age_comparison.cjs
          NODE_PATH=/tmp/scene-qa/node_modules node scripts/check_short_time_finder.cjs
          NODE_PATH=/tmp/scene-qa/node_modules node scripts/check_two_player_cooperative_guide.cjs
          NODE_PATH=/tmp/scene-qa/node_modules node scripts/check_note_referral_funnel.cjs
      - name: Save unpublished scene evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-presentation-evidence
          path: |
            audit-results/scene-presentation/
            audit-results/today-choice/
            audit-results/catalog-expansion/
            audit-results/catalog-search/
            audit-results/catalog-compare/
            audit-results/solo-discovery/
            audit-results/rakuten-preorder/
            audit-results/children-age-comparison/
            audit-results/short-time-finder/
            audit-results/two-player-cooperative/
            audit-results/note-referral-funnel/
          retention-days: 14
