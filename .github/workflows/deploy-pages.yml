name: Build and deploy kyo-bodo-jp

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    - cron: "35 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate game data
        run: |
          python -m pip install --quiet pytest
          pytest -q
      - name: Refresh Rakuten product links
        continue-on-error: true
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python scripts/fetch_rakuten.py
      - name: Build static site
        env:
          SITE_BASE_PATH: /kyo-bodo-jp/
          SITE_ORIGIN: https://stusaurus.github.io
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
