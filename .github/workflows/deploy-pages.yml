name: Build and deploy kyo-bodo-jp

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    - cron: "35 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate game data
        run: |
          python -m pip install --quiet pytest
          pytest -q
      - name: Refresh Rakuten product links
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python scripts/fetch_rakuten.py
      - name: Validate Rakuten audit
        run: python scripts/validate_rakuten_audit.py
      - name: Upload Rakuten audit
        uses: actions/upload-artifact@v4
        with:
          name: rakuten-audit
          path: |
            data/rakuten_audit.json
            data/rakuten_cache.json
      - name: Build static site
        env:
          SITE_BASE_PATH: /kyo-bodo-jp/
          SITE_ORIGIN: https://stusaurus.github.io
          GA_MEASUREMENT_ID: G-Q1N14V276G
        run: python scripts/build_site.py
      - name: Generate SEO discovery files
        env:
          SITE_URL: https://stusaurus.github.io/kyo-bodo-jp/
        run: python scripts/generate_seo_files.py
      - name: Validate generated site before publishing
        run: python scripts/validate_site.py
      - name: Add IndexNow verification key
        run: printf '%s' '7d4f93c2a6814eb5b0d87f216ca9e403' > site/7d4f93c2a6814eb5b0d87f216ca9e403.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Notify IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        env:
          SITE_URL: https://stusaurus.github.io/kyo-bodo-jp/
          INDEXNOW_KEY: 7d4f93c2a6814eb5b0d87f216ca9e403
        run: |
          python - <<'PY'
          import json, os, urllib.request, xml.etree.ElementTree as ET
          base=os.environ["SITE_URL"]; key=os.environ["INDEXNOW_KEY"]; key_url=base+key+".txt"
          if urllib.request.urlopen(key_url, timeout=20).read().decode().strip()!=key: raise SystemExit("IndexNow key verification failed")
          xml=urllib.request.urlopen(base+"sitemap.xml", timeout=20).read()
          root=ET.fromstring(xml); urls=[e.text.strip() for e in root.iter() if e.tag.endswith("loc") and e.text]
          req=urllib.request.Request("https://api.indexnow.org/IndexNow", data=json.dumps({"host":"stusaurus.github.io","key":key,"keyLocation":key_url,"urlList":urls}).encode(), headers={"Content-Type":"application/json; charset=utf-8"}, method="POST")
          with urllib.request.urlopen(req, timeout=30) as r: print("IndexNow", r.status, "URLs", len(urls))
          PY
