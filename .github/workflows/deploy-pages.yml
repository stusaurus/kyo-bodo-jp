name: Build and deploy kyo-bodo-jp

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    - cron: "35 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate game data
        run: |
          python -m pip install --quiet pytest
          pytest -q
      - name: Audit diagnosis coverage
        run: python scripts/audit_diagnosis_coverage.py
      - name: Upload diagnosis coverage audit
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-coverage-audit
          path: data/diagnosis_coverage_audit.json
      - name: Refresh Rakuten product links
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python scripts/fetch_rakuten.py
      - name: Validate Rakuten audit
        run: python scripts/validate_rakuten_audit.py
      - name: Upload Rakuten audit
        uses: actions/upload-artifact@v4
        with:
          name: rakuten-audit
          path: |
            data/rakuten_audit.json
            data/rakuten_cache.json
      - name: Build static site
        env:
          SITE_BASE_PATH: /kyo-bodo-jp/
          SITE_ORIGIN: https://stusaurus.github.io
          GA_MEASUREMENT_ID: G-Q1N14V276G
        run: python scripts/build_site.py
      - name: Generate SEO discovery files
        env:
          SITE_URL: https://stusaurus.github.io/kyo-bodo-jp/
        run: python scripts/generate_seo_files.py
      - name: Validate generated site before publishing
        run: python scripts/validate_site.py
      - name: Add IndexNow verification key
        run: printf '%s' '7d4f93c2a6814eb5b0d87f216ca9e403' > site/7d4f93c2a6814eb5b0d87f216ca9e403.txt

      - name: Restore latest successful IndexNow receipt
        uses: actions/cache/restore@v4
        with:
          path: indexnow-receipt.txt
          key: indexnow-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-receipt-
      - name: Prepare IndexNow change plan before deployment
        run: python scripts/indexnow_changes.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-change-plan
          path: indexnow-plan.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Notify IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-change-plan
      - name: Notify only changed URLs after deployment
        env:
          INDEXNOW_KEY: 7d4f93c2a6814eb5b0d87f216ca9e403
        run: python scripts/indexnow_changes.py notify
      - name: Save acknowledged IndexNow receipt
        uses: actions/cache/save@v4
        with:
          path: indexnow-receipt.txt
          key: indexnow-receipt-${{ github.run_id }}-${{ github.run_attempt }}
